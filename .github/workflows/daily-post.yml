name: Daily Baseball Post
# TJStats Bot — posts baseball analytics content to X

on:
  schedule:
    # Cut to 2 posts/day on 2026-09-18. Removed: 14:00 (Reds summary — their
    # season ended), 18:00 and 21:00 (both BachTalk newsroom threads). A cron
    # with nothing to run still costs an Actions minute and shows up as a green
    # run that posted nothing, so the crons go with the schedule.
    #
    # 10 AM EST (UTC-5) = 15:00 UTC — Pitching Summary card
    - cron: '0 15 * * *'
    # 11 AM EST (UTC-5) = 16:00 UTC — catch-up: re-run either morning slot if it missed
    - cron: '0 16 * * *'
    # 2 PM EST (UTC-5) = 19:00 UTC — Hitter Analysis (Swing+ card)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Content slot to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - screenshot
          - text
          - evening
          - biomechanics
      game_date:
        description: 'Override game date for reds_summary (YYYY-MM-DD, leave empty for yesterday)'
        required: false
        default: ''
        type: string
      generator:
        description: 'Override: run a specific generator by name (leave empty for schedule)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - pitcher_spotlight
          - stat_of_day
          - hardest_pitch
          - guess_pitcher
          - explainer
          - arsenal_vs
          - movement_profile
          - pitching_summary
          - pitcher_card
          - ss_pitching_summary
          - ss_statcast_cards
          - ss_pitch_plots
          - ss_leaderboard
          - ss_heat_maps
          - release_points
          - velo_distribution
          - arsenal_usage
          - milb_pitcher_card
          - milb_pitching_summary
          - milb_trad_pitcher_card
          - milb_trad_pitching_summary
          - biomechanics_101
          - undervalued_relievers
          - reds_summary
          - best_outing
          - swing_plus_top10
          - best_pitch_week
          - hitter_analysis
          - newsroom
          - draft_prospect
      newsroom_kind:
        description: 'Force a newsroom story kind (only when generator=newsroom; empty = auto-rank)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - nasty_pitch
          - overperformer
          - underperformer
          - bat_speed
          - hard_contact
          - pitcher_stuff
          - pitcher_luck

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
            echo "generator=${{ inputs.generator }}" >> $GITHUB_OUTPUT
            echo "catchup=" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 19 ]; then
              # 2 PM EST (19:00 UTC) — Hitter Analysis (text slot)
              echo "slot=text" >> $GITHUB_OUTPUT
              echo "generator=" >> $GITHUB_OUTPUT
              echo "catchup=" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -ge 16 ]; then
              # 11 AM EST (16:00 UTC) — catch-up window
              echo "slot=catchup" >> $GITHUB_OUTPUT
              echo "generator=" >> $GITHUB_OUTPUT
              echo "catchup=true" >> $GITHUB_OUTPUT
            else
              # 10 AM EST (15:00 UTC) — Pitching Summary card
              echo "slot=screenshot" >> $GITHUB_OUTPUT
              echo "generator=" >> $GITHUB_OUTPUT
              echo "catchup=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PITCH_PROFILER_API_KEY: ${{ secrets.PITCH_PROFILER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDS_GAME_DATE: ${{ inputs.game_date }}
          NEWSROOM_KIND: ${{ inputs.newsroom_kind }}
        run: |
          if [ "${{ steps.slot.outputs.catchup }}" = "true" ]; then
            # Catch-up: check post history and run any missed morning slots
            echo "=== CATCH-UP MODE ==="
            python -c "
          import json, sys
          from datetime import datetime, timezone
          history = json.load(open('data/post_history.json'))
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          today_posts = [p for p in history.get('posts', []) if p['date'].startswith(today)]
          today_gens = {p['generator'] for p in today_posts}
          print(f'Posts today: {len(today_posts)} — generators: {today_gens}')
          missed = []
          # ONLY the screenshot slot. This window is 16:00 UTC and the text slot
          # does not run until 19:00, so checking for hitter_analysis here would
          # report it missing every single day and post it three hours early.
          # 'daily' is gone with the Reds summary. pitcher_card is unscheduled
          # now, so a manual run of one must not suppress the real catch-up.
          if 'pitching_summary' not in today_gens:
              missed.append('screenshot')
          print(f'Missed slots: {missed}')
          with open('missed_slots.txt', 'w') as f:
              f.write('\n'.join(missed) + '\n' if missed else '')
          "
            if [ -s missed_slots.txt ]; then
              while IFS= read -r slot; do
                echo "--- Running missed slot: $slot ---"
                python -m src.main --slot "$slot"
                sleep 10
              done < missed_slots.txt
            else
              echo "All morning slots already ran today — nothing to catch up."
            fi
          elif [ -n "${{ steps.slot.outputs.generator }}" ]; then
            ARGS="--generator ${{ steps.slot.outputs.generator }}"
            python -m src.main $ARGS
          else
            ARGS="--slot ${{ steps.slot.outputs.slot }}"
            python -m src.main $ARGS
          fi

      - name: Commit post history
        continue-on-error: true
        run: |
          git config user.name "tjstats-bot"
          git config user.email "bot@tjstats.local"
          git add data/post_history.json
          git diff --cached --quiet || git commit -m "Update post history [skip ci]"
          git push || echo "Warning: git push failed (transient error), skipping"
